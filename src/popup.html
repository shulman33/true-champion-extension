<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>True Champion for ESPN</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 340px;
        padding: 18px;
        background: #09090b;
        color: #e4e4e7;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 900;
        letter-spacing: 0.08em;
        font-size: 13px;
      }
      header img {
        width: 20px;
        height: 20px;
      }
      header span span {
        color: #a3e635;
      }
      .card {
        margin-top: 14px;
        padding: 14px;
        border: 1px solid #27272a;
        border-radius: 14px;
        background: #18181b80;
      }
      .card[data-tone="ok"] {
        border-color: #4d7c0f;
        background: #1a2e0580;
      }
      .card[data-tone="busy"] {
        border-color: #92400e;
        background: #451a0340;
      }
      .card[data-tone="bad"] {
        border-color: #991b1b;
        background: #450a0a40;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #fafafa;
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #71717a;
      }
      [data-tone="ok"] .dot {
        background: #a3e635;
      }
      [data-tone="busy"] .dot {
        background: #f59e0b;
        animation: pulse 1.2s ease-in-out infinite;
      }
      [data-tone="bad"] .dot {
        background: #ef4444;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      .detail {
        margin: 6px 0 0;
        color: #a1a1aa;
      }
      .row {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        padding: 0 2px;
        color: #a1a1aa;
      }
      .row strong {
        color: #e4e4e7;
        font-weight: 600;
      }
      button {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 11px 16px;
        border: 0;
        border-radius: 999px;
        background: #a3e635;
        color: #09090b;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #bef264;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #a3e635;
        outline-offset: 2px;
      }
      .how {
        margin: 12px 2px 0;
        color: #71717a;
        font-size: 12px;
      }
      footer {
        display: flex;
        gap: 14px;
        margin: 14px 2px 0;
        font-size: 12px;
      }
      footer a {
        color: #a3e635;
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
      footer .version {
        margin-left: auto;
        color: #52525b;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" />
      <span>TRUE<span>CHAMPION</span></span>
    </header>

    <section class="card" id="card" data-tone="idle" aria-live="polite">
      <p class="title"><span class="dot"></span><span id="title">Checking…</span></p>
      <p class="detail" id="detail"></p>
    </section>

    <div class="row"><span>ESPN in this browser</span><strong id="espn">…</strong></div>

    <button id="open" type="button">Open True Champion to connect</button>
    <p class="how">
      This extension has one job: when you press Connect on True Champion's ESPN page, it hands over your two ESPN
      cookies. Nothing runs from this window.
    </p>

    <footer>
      <a href="https://github.com/shulman33/true-champion-extension" target="_blank" rel="noreferrer">Source</a>
      <a id="privacy" href="#" target="_blank" rel="noreferrer">Privacy</a>
      <span class="version" id="version"></span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
